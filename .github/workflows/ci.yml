name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` cannot stand in for this: Vite compiles through esbuild,
      # which strips types without checking them. A half-finished refactor
      # (hook renamed, caller not updated) passed both `pnpm test` and
      # `pnpm build` here while `tsc --noEmit` reported three errors.
      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Integration tests (skipped without secrets)
        run: pnpm test:integration
        env:
          RUN_INTEGRATION_TESTS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  db-migrations:
    # Applies the full migration chain to a fresh, empty local Supabase stack
    # (Docker, pre-installed on GitHub-hosted runners) on every push and PR --
    # no secrets needed, since this never touches the real hosted project.
    # Exists because a migration changing a function's return type without an
    # explicit DROP FUNCTION first (Postgres error 42P13) once reached a real
    # `supabase db push` undetected; nothing before this job ever verified the
    # chain applies cleanly from empty.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase stack (applies every migration from empty)
        run: pnpm exec supabase start

      - name: Structural smoke checks
        # Supabase's local dev stack's Postgres is always reachable at this
        # well-known default (matches config.toml's db.port = 54322).
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ci_smoke_checks.sql

      - name: Confirm the chain re-applies cleanly (idempotency)
        run: pnpm exec supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  deploy:
    # Pushes migrations and Edge Functions to the real hosted project. Gated
    # behind the "production" GitHub Environment, which must be configured
    # with a required reviewer in repo Settings -> Environments -> production
    # -- this workflow file alone cannot enforce that approval, only declare
    # that the job uses that environment. Runs only after every check job
    # (including db-migrations, which proves the migration chain replays
    # cleanly from empty) has passed.
    runs-on: ubuntu-latest
    needs: [build-and-test, integration, db-migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Link project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: pnpm exec supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
