name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` cannot stand in for this: Vite compiles through esbuild,
      # which strips types without checking them. A half-finished refactor
      # (hook renamed, caller not updated) passed both `pnpm test` and
      # `pnpm build` here while `tsc --noEmit` reported three errors.
      - name: Typecheck
        run: pnpm typecheck

      # tsconfig.json sets "exclude": ["supabase"], so `pnpm typecheck` never
      # sees the edge functions -- and those are the code that moves money.
      # They are Deno, not Vite, so they need checking on their own terms
      # against supabase/functions/deno.json (which is already "strict": true).
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        working-directory: supabase/functions
        run: deno check --config deno.json ./*/index.ts

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Read-only smoke tests only. `*.destructive.test.ts` is excluded because
      # this job points at a HOSTED project: those suites create users, take
      # stock and write ledger entries, and none of it can be deleted
      # afterwards (enforce_immutable_ledger makes those rows permanent, and
      # the records they reference cannot be removed while they exist). They
      # run in the db-migrations job instead, against a disposable stack.
      #
      # They also refuse to run against a non-local host of their own accord --
      # see tests/integration/_disposable-db.ts. This exclusion is what keeps
      # that refusal from failing an otherwise legitimate job, rather than the
      # thing preventing the damage.
      - name: Integration smoke tests (skipped without secrets)
        run: pnpm test:integration -- --exclude '**/*.destructive.test.ts'
        env:
          RUN_INTEGRATION_TESTS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  db-migrations:
    # Applies the full migration chain to a fresh, empty local Supabase stack
    # (Docker, pre-installed on GitHub-hosted runners) on every push and PR --
    # no secrets needed, since this never touches the real hosted project.
    # Exists because a migration changing a function's return type without an
    # explicit DROP FUNCTION first (Postgres error 42P13) once reached a real
    # `supabase db push` undetected; nothing before this job ever verified the
    # chain applies cleanly from empty.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase stack (applies every migration from empty)
        run: pnpm exec supabase start

      - name: Structural smoke checks
        # Supabase's local dev stack's Postgres is always reachable at this
        # well-known default (matches config.toml's db.port = 54322).
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/ci_smoke_checks.sql

      # Run the money-path tests here rather than in the `integration` job.
      # That job is gated on secrets pointing at a hosted project, so it is
      # skipped on forks and on any checkout without them -- exactly the runs
      # where a regression would slip through. This job already has a real
      # stack with the whole chain replayed from empty, needs no secrets, and
      # the database is disposable, so the adversarial cases (concurrent
      # checkouts on the last unit of stock, redelivered webhooks, anon
      # callers) can run destructively without touching anything real.
      - name: Money-path integration tests
        env:
          RUN_INTEGRATION_TESTS: 'true'
          SUPABASE_URL: http://127.0.0.1:54321
        run: |
          # `status -o env` prints KEY="value" pairs for the running stack.
          # Sourcing it is more robust than parsing individual lines, and keeps
          # working if the CLI renames or reorders keys.
          eval "$(pnpm exec supabase status -o env)"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "no service role key from supabase status"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "no anon key from supabase status"; exit 1; }
          pnpm test:integration

      - name: Confirm the chain re-applies cleanly (idempotency)
        run: pnpm exec supabase db reset

      - name: Stop local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  deploy:
    # Pushes migrations and Edge Functions to the real hosted project. Gated
    # behind the "production" GitHub Environment, which must be configured
    # with a required reviewer in repo Settings -> Environments -> production
    # -- this workflow file alone cannot enforce that approval, only declare
    # that the job uses that environment. Runs only after every check job
    # (including db-migrations, which proves the migration chain replays
    # cleanly from empty) has passed.
    runs-on: ubuntu-latest
    needs: [build-and-test, integration, db-migrations]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Link project
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push database migrations
        run: pnpm exec supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: pnpm exec supabase functions deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
